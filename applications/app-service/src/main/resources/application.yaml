server:
  port: 8080
spring:
  application:
    name: "auth-crediya"
  devtools:
    add-properties: false
  profiles:
    include: null
  r2dbc:
    initialization-mode: always
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "*"

# PostgreSQL Configuration
adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: autenticacion_db
    schema: public
    username: postgres
    password: password123

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs
    enabled: true

# JWT Configuration
jwt:
  issuer: "auth-crediya"
  expiry: 60000  # 1 hour
  algorithm: "RS256"
  private-key-path: "classpath:keys/private.pem"
  public-key-path: "classpath:keys/public.pem"