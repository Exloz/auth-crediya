server:
  port: ${APP_PORT:8080}
spring:
  application:
    name: ${APP_NAME:AuthService}
  devtools:
    add-properties: false
  profiles:
    include: null
  r2dbc:
    initialization-mode: always
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "*"

adapters:
  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:autenticacion_db}
    schema: "public"
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password123}

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs
    enabled: true

# JWT Configuration
jwt:
  issuer: ${JWT_ISSUER:AuthService}
  expiry: ${JWT_EXPIRY:3600000}
  algorithm: "RS256"
  private-key-path: ${JWT_PRIVATE_KEY_PATH:classpath:keys/private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}